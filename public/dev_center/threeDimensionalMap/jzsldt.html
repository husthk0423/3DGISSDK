<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>加载矢量底图</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
		<link rel='stylesheet' href='./css/geoway-gl.css' />
		<script src="./js/geoway-gl-dev.min.js"></script>
		<style>
			body {margin: 0;padding: 0;}
			html,body,#map {height: 100%;}
		</style>

	</head>
	<body>
		<div id='map'></div>
		<script>
			var map  = new Geoway.Map({
			    container: 'map',
			    zoom: 14,
			    maxTileCacheSize:100,
			    bearing:0,
			    pitch:60,
			    center: [ 120.06, 28.69]
			});
			map.setLightIntensity(0.3);
			//矢量底图图层
			var vectorLayer = new Geoway.VectorLayer('http://ditu.zjzwfw.gov.cn/mapserver/data/zjvmap/getData?x={x}&y={y}&l={z}&styleId=tdt_biaozhunyangshi_2017&tilesize=512&return_type=stream_snappy',
			    {tileSize:512,useFbo:true,ratio:1,tileFaceTime:0,heightProperty : 'floor',roofColor:'#FF6801',wallColor:'#FF6801',fillAlpha : 1,heightScale:3.2,style:null,needDecode:false,});
			map.addLayer(vectorLayer);
		</script>

	</body>
</html>
