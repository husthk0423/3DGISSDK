<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>加载栅格注记</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel='stylesheet' href='./css/geoway-gl.css' />
    <script src="./js/geoway-gl-dev.min.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
    </style>
</head>
<body>
<div id='map'></div>
<script>
    var map  = new Geoway.Map({
        container: 'map',
        zoom: 14,
        maxTileCacheSize:100,
        bearing:0,
        pitch:60,
        center: [ 120.06, 28.69]
    });
    //栅格注记图层
    var xyz = new Geoway.XYZ(['http://ditu.zjzwfw.gov.cn/mapserver/label/zjvmap/getImg?x={x}&y={y}&l={z}&styleId=tdt_biaozhunyangshi_2017&tilesize=512&ratio=1'],{tileSize:512});
    map.addLayer(xyz);
</script>
</body>
</html>
