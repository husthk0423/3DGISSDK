<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>过滤注记要素</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
		<link rel='stylesheet' href='./css/geoway-gl.css' />
		<script src="./js/geoway-gl-dev.min.js"></script>
		<style>
			body {margin: 0;padding: 0;}
			html,body,#map {height: 100%;}
		</style>
	</head>
	<body>
		<div id='map'></div>
		<script>
			var map = new Geoway.Map({
				container: 'map',
				zoom: 18,
				maxTileCacheSize: 100,
				bearing: 0,
				pitch: 0,
				fontName: '微软雅黑',
				glyphUrl: './fonts/{fontstack}/{range}.pbf',
				center: [120.18, 30.26]
			});

			map.setLightIntensity(0.3);

			//混合图层
			var mixLayer = new Geoway.MixLayer(
				'http://ditu.zjzwfw.gov.cn/mapserver/data/zjvmap/getData?x={x}&y={y}&l={z}&styleId=tdt_biaozhunyangshi_2017', {
					tileSize: 512,
					useFbo: true,
					ratio: 1,
					tileFaceTime: 0,
					heightProperty: 'floor',
					roofColor: '#E7DED0',
					wallColor: '#E7DED0',
					fillAlpha: 1,
					heightScale: 3.2,
					style: null,
					needDecode:false,
				});
			var filter = new Geoway.Filter();
			filter.otherDisplay = false;
			var filterLayer = new Geoway.FilterLayer();
			filterLayer.display = true;
			filterLayer.id = '交通_交通注记_公路';
			filter.addFilterLayer(filterLayer);
			
			mixLayer.setFilter(filter);	
			
			map.addLayer(mixLayer);

		</script>
	</body>
</html>
