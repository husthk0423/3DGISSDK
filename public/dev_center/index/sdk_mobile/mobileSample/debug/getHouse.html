<!DOCTYPE html>
<html>
<head>
    <title></title>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel='stylesheet' href='../dist/map-gl.css' />
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
    </style>
</head>

<body onload="onLoad()">
<div id='map'></div>
<script src="../dist/mapgl-gl-dev.js"></script>
<script src="../js/Filter.js"></script>
<script src="../js/FilterLayer.js"></script>
<script src="../js/MapUtil.js"></script>
<script src="../js/jquery-3.1.1.js"></script>
<script>

    function onLoad() {
        var sheet = {
            'layers': [],
            'metadata': [],
            'sources': {},
            'draft': false,
            'id': 'streets-v9',
            'version': 8,
            "light": {
                "anchor": "viewport",
                "color": "white",
                "intensity": 0.3
            },
            'glyphs': 'http://118.178.118.175:8088/mobileSample/debug/font/{range}.pbf'
        };
        var map = window.map = new mapgl.Map({
            container: 'map',
            zoom: 17,
            center: [ 120.15, 30.268],
            hash: false,
            style: sheet
        });
        
        map.on('load', function () {
	       //底图数据源
	   		var source = {
                "type": "raster",
                "tiles": ['http://118.178.118.175/mapserver/vmap/zjvmap/getMAP?x={x}&y={y}&l={z}&styleId=tdt_biaozhunyangshi_2017'],
        		"tileSize": 256
            };


            //底图图层
            var layer = {
                "id": "wms-test-layer",
                "type": "raster",
                "source": source,
                "paint": {}
            };
            //加入底图图层到map中
            map.addLayer(layer);


            //注记数据源,tiles为获取注记数据的url
            var symbolSource = {
                "type": "vector",
                "styleUrl":'http://118.178.118.175:8088/mobileSample/style/labelStyle', //请求注记样式文件的接口
                "styleId":'style',//注记样式文件的id
                "isLable":true,
                "tiles": ['http://118.178.118.175/mapserver/label/zjvmap/getDatas?x={x}&y={y}&l={z}&styleId=tdt_biaozhunyangshi_2017'],
                "tileSize": 256
            };

            map.addSource('symbolSource',symbolSource);
        });

        map.on('click',function(data){
            var lngLat = data.lngLat;
            //根据地理坐标获取层行列号
            var p = MapUtil.LngLatToTilePoint(map,lngLat);
            $.ajax({ url: "http://118.178.118.175/mapserver/pickup/zjvmap/getData?x="+p.column+"&y="+p.row+"&l="+p.level+
                "&pixelX="+p.y+"&pixelY="+p.x+"&styleId=tdt_biaozhunyangshi_2017",dataType:"json", success: function(features){
                for(var layerName in features){
                    var layerFeature = features[layerName];

                    for(var key in layerFeature){
                        var feature = layerFeature[key];
                        var markerHeight = 0, markerRadius = 0, linearOffset = 0;
                        var popupOffsets = {
                            'top': [0, 0],
                            'top-left': [0,0],
                            'top-right': [0,0],
                            'bottom': [0, -markerHeight],
                            'bottom-left': [linearOffset, (markerHeight - markerRadius + linearOffset) * -1],
                            'bottom-right': [-linearOffset, (markerHeight - markerRadius + linearOffset) * -1],
                            'left': [markerRadius, (markerHeight - markerRadius) * -1],
                            'right': [-markerRadius, (markerHeight - markerRadius) * -1]
                        };
                        var popup = new mapgl.Popup({offset:popupOffsets,closeButton:false})
                            .setLngLat(lngLat)
                            .setHTML('<h3>编号:'+feature.fcode+'</h3>'+
                                '<h3>id:'+feature.objectid+'</h3>')
                            .addTo(map);
                        break;
                    }
                    break;
                }
            }});
        });
    }
</script>
</body>
</html>
