<!DOCTYPE html>
<html>
<head>
    <title></title>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel='stylesheet' href='../dist/map-gl.css' />
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
    </style>
</head>

<body onload="onLoad()">
<div id='map'></div>
<script src="../dist/mapgl-gl-dev.js"></script>
<script src="../js/Filter.js"></script>
<script src="../js/FilterLayer.js"></script>
<script src="../js/GeowayUtil.js"></script>

<script>

    function onLoad() {
        var sheet = {
            'layers': [],
            'metadata': [],
            'sources': {},
            'draft': false,
            'id': 'streets-v9',
            'version': 8,
            "light": {
                "anchor": "viewport",
                "color": "white",
                "intensity": 0.3
            },
            'glyphs': 'http://118.178.118.175:8088/mobileSample/debug/font/{range}.pbf'
        };
        var map = window.map = new mapgl.Map({
            container: 'map',
            zoom: 8,
            center: [ 120.15, 30.268],
            hash: false,
            style: sheet
        });
        
        map.on('load', function () {
	       //底图数据源
	   		var source = {
                "type": "raster",
                "tiles": ['http://118.178.118.175/mapserver/vmap/zjvmap/getMAP?x={x}&y={y}&l={z}&styleId=tdt_biaozhunyangshi_2017'],
        		"tileSize": 256
            };


            //底图图层
            var layer = {
                "id": "wms-test-layer",
                "type": "raster",
                "source": source,
                "paint": {}
            };
            //加入底图图层到map中
            map.addLayer(layer);
        });

        map.on('click',function(data){
            var lngLat = data.lngLat;
            //根据地理坐标获取层行列号
            var p = GeowayUtil.LngLatToTilePoint(map,lngLat);

            //根据地理坐标获取层行列号
            //var p = GeowayUtil.screenPointToTilePoint(map,600,156);

            var markerHeight = 0, markerRadius = 0, linearOffset = 0;
            var popupOffsets = {
                'top': [0, 0],
                'top-left': [0,0],
                'top-right': [0,0],
                'bottom': [0, -markerHeight],
                'bottom-left': [linearOffset, (markerHeight - markerRadius + linearOffset) * -1],
                'bottom-right': [-linearOffset, (markerHeight - markerRadius + linearOffset) * -1],
                'left': [markerRadius, (markerHeight - markerRadius) * -1],
                'right': [-markerRadius, (markerHeight - markerRadius) * -1]
            };
            var popup = new mapgl.Popup({offset:popupOffsets,closeButton:false})
                .setLngLat(lngLat)
                .setHTML('<h3>行号:'+p.row+'</h3>'+
                        '<h3>列号:'+p.column+'</h3>'+
                        '<h3>x:'+p.x+'</h3>'+
                         '<h3>y:'+p.y+'</h3>')
                .addTo(map);
        });
    }
</script>
</body>
</html>
