<!DOCTYPE html>
<html>
<head>
    <title></title>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel='stylesheet' href='../dist/map-gl.css' />
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
    </style>
</head>

<body >
<div id='map'></div>
<script src="../dist/mapgl-gl-dev.js"></script>
<script src="../js/Filter.js"></script>
<script src="../js/FilterLayer.js"></script>
<script src="../js/GeowayUtil.js"></script>

<script>

    var sheet = {
        'layers': [],
        'metadata': [],
        'sources': {},
        'draft': false,
        'id': 'streets-v9',
        'version': 8,
        "light": {
            "anchor": "viewport",
            "color": "white",
            "intensity": 0.3
        },
        'glyphs': 'http://118.178.118.175:8088/mobileSample/debug/font/{range}.pbf'
    };
    var map = window.map = new mapgl.Map({
        container: 'map',
        zoom: 8,
        center: [ 120.15, 30.268],
        hash: false,
        style: sheet
    });


	map.on('load', function() {
		//底图数据源
   		var source = {
            "type": "raster",
            "tiles": ['http://118.178.118.175/mapserver/vmap/zjvmap/getMAP?x={x}&y={y}&l={z}&styleId=tdt_biaozhunyangshi_2017'],
    		"tileSize": 256
        };


        //底图图层
        var layer = {
            "id": "wms-test-layer",
            "type": "raster",
            "source": source,
            "paint": {}
        };
        //加入底图图层到map中
        map.addLayer(layer);
		
	    // 扩展API加载完毕后调用onPlusReady回调函数
	    document.addEventListener('plusready', onPlusReady, false);
	    var frist = true;
	    function onPlusReady(){
	        //监听地理坐标变换
	        plus.geolocation.watchPosition(function(p){
	            if(frist){
	                initNavigation(map,p.coords);
	                frist = false;
	            }else{
	                updatePosition(map,p.coords);
	            }
	        }, function(e){
	            alert('Geolocation error: ' + e.message);
	        } ,{maximumAge:5000});
	
	
	        //监听旋转角度变换
	        plus.orientation.watchOrientation( function ( o ) {
	            updateDirection(map,o);
	        }, function ( e ) {
	            alert( "Orientation error: " + e.message );
	        } ,{frequency:5000});
	
	    }
    });

    var point = {
        "type": "Point",
        "coordinates": [-74.50, 40]
    };

    //初始化GPS,将GPS图标加入地图中
    function initNavigation(map,coords){
        var img = new Image();
        img.onload = function(){
            map.addImage('cat', img);
            point.coordinates[0] = coords.longitude;
            point.coordinates[1] = coords.latitude;
            map.addSource('gps', { type: 'geojson', data: point });
            map.addLayer({
                "id": "gps",
                "type": "symbol",
                "source":'gps',
                "layout": {
                    "icon-image": "cat",
                    "icon-rotation-alignment": "map",
                    "icon-size": 1
                }
            });
        };
        img.src = '../img/navigation.png';
    }

    //更新GPS坐标位置
    function updatePosition(map,coords){
        point.coordinates[0] = coords.longitude;
        point.coordinates[1] = coords.latitude;
        map.getSource('gps').setData(point);
    }

    //更新GPS方位角
    function updateDirection(map,o){
        var direction = o.alpha;
        map.setLayoutProperty('gps', 'icon-rotate', direction * (180 / Math.PI));
    }
</script>
</body>
</html>
