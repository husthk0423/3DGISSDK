<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>rastertile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel='stylesheet' href='../dist/geoway-gl.css' />
    <script src="../dist/geoway-gl-dev.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
    </style>
</head>
<body>
<div id='map'></div>
<script>
    var map  = new Geoway.Map({
        container: 'map',
        zoom: 17,
        pitch:51.99999999999999,
        bearing:136.14875283446713,
        maxTileCacheSize:100,
        center: [ 120.15356283162896, 30.267378069231704]
    });



    var xyz = new Geoway.XYZ(
        ['http://ditu.zjzwfw.gov.cn/mapserver/vmap/zjvmap/getMAP?x={x}&y={y}&l={z}&styleId=tdt_biaozhunyangshi_2017&tilesize=256&ratio=1'],
        {tileSize:256});
    map.addLayer(xyz);


    //label图层
    var label = new Geoway.LabelLayer('http://ditu.zjzwfw.gov.cn/mapserver/label/zjvmap/getDatas?x=${x}&y=${y}&l=${z}&styleId=tdt_biaozhunyangshi_2017&tilesize=256',{tileSize:256});
    map.addLayer(label);

    map.addGltf({
        path : "../data/gltf/abuilding/",
        name : "scene.gltf",
        mapPos : [120.153, 30.268, 0.1],
        scale : 0.05
    });


</script>

</body>
</html>
