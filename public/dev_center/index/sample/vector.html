<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>rastertile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel='stylesheet' href='../dist/geoway-gl.css' />
    <script src="../dist/geoway-gl-dev.min.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
    </style>


</head>
<body>
<div id='map'></div>
<script>
    var map  = new Geoway.Map({
        container: 'map',
        pitch:30,
        zoom: 17,
        maxTileCacheSize:100,
        center: [ 120.487489, 30.095157]
    });

    map.setLightIntensity(0.3);
    var xyz = new Geoway.XYZLayer(['http://ditu.zjzwfw.gov.cn/mapserver/vmap/zjvmap/getMAP?x={x}&y={y}&l={z}&styleId=tdt_biaozhunyangshi_2017&tilesize=512&ratio=1'],
        {tileSize:512});
    map.addLayer(xyz);

    //label图层
    var label = new Geoway.LabelLayer('http://ditu.zjzwfw.gov.cn/mapserver/label/zjvmap/getDatas?x=${x}&y=${y}&l=${z}&styleId=tdt_biaozhunyangshi_2017&tilesize=512',{tileSize:512});


    var fillExtrusionLayer = new Geoway.FillExtrusionLayer('http://ditu.zjzwfw.gov.cn/mapserver/label/3dbuildings/getDatas?x={x}&y={y}&l={z}&styleId=3dbuildings&tilesize=512',
        {tileSize:512,heightProperty : 'height',roofColor:'#ffffff',wallColor:'#eeeeee',fillAlpha : 0.8});

    label.addHeightLayer(fillExtrusionLayer);
    map.addLayer(label);
    map.addLayer(fillExtrusionLayer);

    map.on('zoom',function(){
        let z = map.transform._zoom;

        if(map.transform.pitch < 10){
            return;
        }
        let p = map.transform.getMaxPitch(z);
        map.transform.pitch = p;
    });
</script>
</body>
</html>
