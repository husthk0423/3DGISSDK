<!DOCTYPE html>
<html  style="overflow : hidden; ">
<head>
    <title>天地图矢量瓦片</title>
    <meta name="keywords" content="矢量瓦片,矢量索引">
    <meta name="description" content="矢量瓦片">
    <meta name="content-type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width,target-densitydpi=high-dpi,initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <link rel="stylesheet" href="css/leaflet.css" />

    <script src="js/jquery-3.1.1.js"></script>
    <script src="js/uuid.js"></script>
    <script src="js/leaflet.js"></script>
    <script src="js/CustomWebSDK.js"></script>
</head>

<body onload="init()"  style="margin : 0; ">
<div id="map" class="map" style ="position:absolute;bottom:0px;top:0px;width:100%"></div>


<script>
    function init(){
        var map = L.map('map',{crs:L.CRS.CustomEPSG4326,center: {lon:120.158, lat:30.292},zoom: 15,inertiaDeceleration:15000});
        //添加底图
        var layer = new L.GXYZ('http://ditu.zjzwfw.gov.cn/mapserver/vmap/zjvmap/getMAP?x={x}&y={y}&l={z}&styleId=tdt_biaozhunyangshi_2017',{tileSize:512});
        layer.urlArray = [
            'http://ditu0.zjzwfw.gov.cn',
            'http://ditu1.zjzwfw.gov.cn',
            'http://ditu2.zjzwfw.gov.cn',
            'http://ditu3.zjzwfw.gov.cn',
            'http://ditu5.zjzwfw.gov.cn',
            'http://ditu6.zjzwfw.gov.cn'
        ];
        map.addLayer(layer);

        //添加注记图层,注记服务还在完善中，等服务完成后，再使用
        var labelLayer = new L.GWVTAnno({ tileSize: 512});
        var dataSource = new Custom.URLDataSource();
        dataSource.url = 'http://ditu.zjzwfw.gov.cn/mapserver/label/zjvmap/getDatas?x=${x}&y=${y}&l=${z}&styleId=tdt_biaozhunyangshi_2017';
        dataSource.urlArray = [
            'http://ditu0.zjzwfw.gov.cn',
            'http://ditu1.zjzwfw.gov.cn',
            'http://ditu2.zjzwfw.gov.cn',
            'http://ditu3.zjzwfw.gov.cn',
            'http://ditu5.zjzwfw.gov.cn',
            'http://ditu6.zjzwfw.gov.cn'
        ];
        labelLayer.addDataSource(dataSource);

        map.addLayer(labelLayer);


    }

</script>

</body>
</html>
