<!DOCTYPE html>
<html  style="overflow : hidden; ">
<head>
    <title>叠加天地图wmts底图</title>
    <meta name="keywords" content="矢量瓦片,矢量索引">
    <meta name="description" content="矢量瓦片">
    <meta name="content-type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width,target-densitydpi=high-dpi,initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <link rel="stylesheet" href="/index/sdk_web/leafletSDK/css/leaflet.css" />

</head>

<body onload="init()"  style="margin : 0; ">
    <div id="map" class="map" style ="position:absolute;bottom:0px;top:0px;width:100%"></div>

    <script src="/index/sdk_web/leafletSDK/js/uuid.js"></script>
    <script src="/index/sdk_web/leafletSDK/js/leaflet.js"></script>
    <script src="/index/sdk_web/leafletSDK/js/CustomWebSDK.min.js"></script>
    <script>
        function init(){
            var map = L.map('map',{crs:L.CRS.CustomEPSG4326,center: {lon:120.15, lat:30.268},maxZoom: 20,zoom:8,inertiaDeceleration:15000,inertiaThreshold:2000});

            //添加wmts图层
            var tdtlayer = new L.TileLayer('http://t4.tianditu.com/DataServer?T=vec_c&x={x}&y={y}&l={z}',{tileSize:256,maxZoom: 20,keepBuffer:0,updateWhenZooming:false});
            map.addLayer(tdtlayer);

            //添加底图
            var layer = new L.GXYZ('http://ditu.zjzwfw.gov.cn/mapserver/vmap/zjvmap/getMAP?x={x}&y={y}&l={z}&styleId=tdt_biaozhunyangshi_2017',{tileSize:256,maxZoom: 20,keepBuffer:0,updateWhenZooming:false});
            map.addLayer(layer);

            //添加注记图层
            var labelLayer = new L.GWVTAnno({tileSize:512});
            var dataSource = new Custom.URLDataSource();
            dataSource.url = 'http://ditu.zjzwfw.gov.cn/mapserver/label/zjvmap/getDatas?x=${x}&y=${y}&l=${z}&styleId=tdt_biaozhunyangshi_2017';
            labelLayer.addDataSource(dataSource);
            map.addLayer(labelLayer);
        }

    </script>

</body>
</html>
