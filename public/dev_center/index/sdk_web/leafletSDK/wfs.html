<!DOCTYPE html>
<html  style="overflow : hidden; ">
<head>
    <title>叠加wfs网吧注记</title>
    <meta name="keywords" content="矢量瓦片,矢量索引">
    <meta name="description" content="矢量瓦片">
    <meta name="content-type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width,target-densitydpi=high-dpi,initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <link rel="stylesheet" href="/index/sdk_web/leafletSDK/css/leaflet.css" />

    <script src="/index/sdk_web/leafletSDK/js/uuid.js"></script>
    <script src="/index/sdk_web/leafletSDK/js/leaflet.js"></script>
    <script src="/index/sdk_web/leafletSDK/js/CustomWebSDK.min.js"></script>
</head>

<body onload="init()"  style="margin : 0; ">
<div id="map" class="map" style ="position:absolute;bottom:0px;top:0px;width:100%"></div>
<div id="loading" style="width: 100%;height: 100%;position: absolute;background-color: #FFFFFF">
    <img src="/index/sdk_web/leafletSDK/images/loading.gif" style="position: absolute;margin: auto auto;left: 0;right: 0;top: 0;bottom: 0"></img>
</div>


<script>
    function init(){
        //获取wfs数据
        Custom.getJSON({url:'http://ditu.zjzwfw.gov.cn/geoserver/zjplatform/D376822/wfs?request=GetFeature&version=1.1.0&typename=zjplatform:D376822&outputformat=json',dataType:'json'})
            .then(function(result) {
                document.getElementById("loading").style.display = 'none';

                var map = L.map('map',{crs:L.CRS.CustomEPSG4326,center: {lon:121.24, lat:29.268},maxZoom: 20,zoom:10,inertiaDeceleration:15000,inertiaThreshold:2000});
                //添加底图
                var layer = new L.GXYZ('http://ditu.zjzwfw.gov.cn/mapserver/vmap/zjvmap/getMAP?x={x}&y={y}&l={z}&styleId=tdt_biaozhunyangshi_2017',{tileSize:512,maxZoom: 20,keepBuffer:0,updateWhenZooming:false});
                map.addLayer(layer);

                //添加注记图层
                var labelLayer = new L.GWVTAnno({tileSize:512});
                var dataSource = new Custom.URLDataSource();
                dataSource.url = 'http://ditu.zjzwfw.gov.cn/mapserver/label/zjvmap/getDatas?x=${x}&y=${y}&l=${z}&styleId=tdt_biaozhunyangshi_2017';
                labelLayer.addDataSource(dataSource);


                //本地数据源
                var localDataSource = new Custom.LocalDataSource();
                for(var i = 0;i<result.features.length;i++){
                    var item = result.features[i];
                    var feature = new Custom.Feature();
                    feature.attributes = item.properties;
                    feature.sourceData = [item.geometry.coordinates[1],item.geometry.coordinates[0]];
                    feature.style = {"show":true,"labelfield":"NAME","avoidField":"avoidWeight","avoidWeight":100000,"chinaLabelWidth":16,"otherLabelWidth":16,"angle":30,"texture":"redpoint.svg","isImportant":false,"pointHashOutline":false,"pointHashBackground":false,"graphicYOffset":0,"graphicXOffset":0,"graphicHeight":14,"graphicWidth":14,"graphicDistance":3,"direction":0,"pointFillStyle":"#000000","pointFillFont":"normal 12px 微软雅黑","pointFillAlpha":1,"pointLineWidth":0,"pointStrokeStyle":"#FFFFFF","pointStrokeFont":"normal 12px 微软雅黑","pointStrokeAlpha":1,"pointHeight":12,"pointBackgroundColor":"#EDD976","pointBackgroundAlpha":1,"pointBackgroundLineWidth":0,"pointBackgroundLineColor":"#FFFFFF","pointBackgroundRadius":5,"pointBackgroundGap":0,"isFourDirections":false,"labelFunction":"","distance":0};
                    feature.addAttribute('primaryId',Math.random());
                    feature.addAttribute('avoidWeight',feature.style.avoidWeight);
                    localDataSource.addFeature(feature);
                }

                localDataSource.addTextureUrl('redpoint.svg','http://ditu.zjzwfw.gov.cn:8088/leafletSDK/images/redpoint.svg');
                labelLayer.addDataSource(localDataSource);
                map.addLayer(labelLayer);
            }.bind(this));
    }

</script>
</body>
</html>
