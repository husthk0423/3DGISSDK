<!DOCTYPE html>
<html lang="en" style="width: 100%; height: 100%; margin: 0px; overflow: hidden">
  <head>
    <meta charset="UTF-8" />
    <title>开发中心</title>
    <meta name="description" content="Description" />
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" />
    <link rel="stylesheet" href="./fonts/font.css" async />
    <link rel="stylesheet" href="./css/menu.css" />
    <script src="./lib/jquery/jquery-1.11.1.js"></script>
    <script src="./js/menuJson.js"></script>
    <!-- <script src="./js/menu.js"></script> -->
    <style>
      ::-webkit-scrollbar {
        width: 5px;
        height: 8px;
        background: #b9b9b9;
        border-radius: 5px;
      }

      ::-webkit-scrollbar-button {
        display: none;
      }

      ::-webkit-scrollbar-thumb {
        border-radius: 10px;
        background: #54b5ff;
      }

      ::-webkit-scrollbar-track {
        border-radius: 10px;
        background: rgba(54, 87, 123, 0.9);
      }
    </style>
  </head>

  <body style="width: 100%; height: 100%; margin: 0px; overflow: hidden" topmargin="0" leftmargin="0" id="world">
    <script>
      window.selectItem = function (data) {
        // 如果是静态页面
        if (data.toLink.indexOf('.html') > -1) {
          $('#iframe').attr('src', data.toLink);
        }
        //如果为叶子节点
        else if (!data.hasOwnProperty('children')) {
          $('#iframe').attr('src', data.toLink + '/');
        }
      };
    </script>
    <div class="header-menu">
      <div class="header-button">
        <img src="./img/开发中心logo.png" alt="" />
        <span>开发中心</span>
      </div>

      <div class="menu-list"></div>

      <!-- <div id='cssmenu'>
      <ul>

      </ul>
    </div> -->
    </div>
    <div style="position: absolute; left: 0px; top: 80px; bottom: 0px; right: 0px; margin: auto">
      <iframe id="iframe" class="homeIframe" frameborder="0" marginheight="0" marginwidth="0" border="0" style="width: 100%; height: 100%; margin: 0px; padding: 0px"></iframe>
    </div>
  </body>

  <script>
    let eles = [];
    menuJson.forEach(item => {
      const { name, isChecked } = item;
      const listItemEle = $(`
          <div class="list-item ">
            <span>${name}</span>
          </div>`);
      listItemEle[0].attribute = item;
      if (isChecked) {
        listItemEle[0].classList.add('is-checked');
        $('.homeIframe').attr('src', item.toLink + '/');
      }
      eles.push(listItemEle);
    });
    $('.menu-list').append(...eles);

    $('.list-item').click(function () {
      $('.list-item').each(function () {
        $(this)[0].classList.remove('is-checked');
      });
      $(this)[0].classList.add('is-checked');
      console.log($(this)[0].attribute);
      $('.homeIframe').attr('src', $(this)[0].attribute.toLink + '/');
    });
  </script>
</html>
