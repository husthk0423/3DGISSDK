<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>指定方向流动的水流</title>
  <link rel="stylesheet" href="../../css/bootstrap.min.css">
  <link rel="stylesheet" href="../../css/style.css" />
  <script src="../../libs/Cesium/Cesium.js"></script>
  <script src="../js/config.js"></script>
</head>

<body>
  <div id="cesiumContainer" class="fullSize"></div>
</body>

<script>
  var viewer;
  var FlowWater;

  function createMap() {
    viewer = new Cesium.Viewer('cesiumContainer', {
      animation: false, // 是否显示动画控件
      baseLayerPicker: false, // 是否显示图层选择控件
      fullscreenButton: false, // 是否显示全屏按钮控件
      vrButton: false, // 是否显示vr按钮控件
      geocoder: false, // 是否显示地名查找控件
      homeButton: false, // 是否显示主页按钮控件
      infoBox: false, // 是否显示点击要素之后显示的信息
      sceneModePicker: false, // 是否显示投影方式控件
      selectionIndicator: false, // 是否获取选择周指示器
      timeline: false, // 是否显示时间线控件
      navigationHelpButton: false, // 是否显示帮助信息控件
      useBrowserRecommendedResolution: false, // 是否以浏览器建议的分辨率渲染
      // contextOptions:{
      //   requestWebgl2:true
      // },
      // msaaSamples:4,
      imageryProvider: false, //不加载cesium提供的图层
    });
    viewer.scene.globe.depthTestAgainstTerrain = true; // 深度测试
    // viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString("#99ccff");

    // 设置位置
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(114.14130022837226, 35.71685016666132, 128.85918659983847),
      orientation: {
        heading: Cesium.Math.toRadians(301.54523494564677),
        pitch: Cesium.Math.toRadians(-22.33971043100374),
        roll: 0
      }
    });

    // 添加模型
    // 添加模型
    const tile3d = new Cesium.Cesium3DTileset({
      url: "http://localhost:8080/%E6%96%B0%E5%BB%BA%E6%96%87%E4%BB%B6%E5%A4%B9/sk/sk/tileset.json",
      showFS: false,
      showVS: false,
    });
    tile3d.readyPromise.then(tileset => {
      viewer.scene.primitives.add(tileset);
      // 调整模型高度，贴合地形，地形是30m精度，只能做到尽可能贴合
      var boundingSphere = tileset.boundingSphere;
      var cartographic = Cesium.Cartographic.fromCartesian(boundingSphere.center);
      var surface = Cesium.Cartesian3.fromRadians(cartographic.longitude, cartographic.latitude, 0.0);
      var offset = Cesium.Cartesian3.fromRadians(cartographic.longitude, cartographic.latitude, 0);
      var translation = Cesium.Cartesian3.subtract(offset, surface, new Cesium.Cartesian3());
      tileset.modelMatrix = Cesium.Matrix4.fromTranslation(translation);
    });

    collection = viewer.scene.postProcessStages;
  }
  // 添加水面
  function addWater() {
    var newWaterPosition = [];
    waterPosition2.forEach(item => {
      newWaterPosition.push(item.x);
      newWaterPosition.push(item.y);
    });

    var polygonInstance = new Cesium.GeometryInstance({
      geometry: Cesium.PolygonGeometry.fromPositions({
        positions: Cesium.Cartesian3.fromDegreesArray(newWaterPosition),
        height: 91,
        extrudedHeight: 91,
        vertexFormat: Cesium.EllipsoidSurfaceAppearance.VERTEX_FORMAT
      }),
      attributes: {
        color: Cesium.ColorGeometryInstanceAttribute.fromColor(Cesium.Color.fromCssColorString('#ff0000').withAlpha(0.5))
      }
    });

    FlowWater = new Cesium.Primitive({
      geometryInstances: [polygonInstance],
      undisplayable: true,
      appearance: new Cesium.EllipsoidSurfaceAppearance({
        material: Cesium.Material.fromType('FlowWater', {
          waveImage: '../../img/water.jpg',
        })
      })
    });
    viewer.scene.primitives.add(FlowWater);
  }

  function startup() {
    'use strict';
    createMap();
    addWater();
  }
  if (typeof Cesium !== 'undefined') {
    startup();
  }
</script>

</html>
