<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>加载球皮</title>
  <link rel="stylesheet" href="../../css/bootstrap.min.css" />
  <link rel="stylesheet" href="../../css/style.css" />
  <script src="../../libs/Cesium/Cesium.js"></script>
  <script src="../../libs/jquery-3.1.1.min.js"></script>
</head>

<body>
  <div id="cesiumContainer" class="fullSize"></div>

  <div class="tab-list">
    <div class="tab-content">
      <div class="tab-item" onclick="toggleSkin('skin-blue')"><span>球皮1</span></div>
      <div class="tab-item" onclick="toggleSkin('skin-black')"><span>球皮2</span></div>
    </div>
  </div>
</body>

<script src="../js/tabToggle.js"></script>
<script>
  var viewer;
  var skinList = [];

  function createMap() {
    viewer = new Cesium.Viewer('cesiumContainer', {
      selectionIndicator: false, // 是否获取选择周指示器
      useBrowserRecommendedResolution: false, // 是否以浏览器建议的分辨率渲染
      animation: false, // 是否显示动画控件
      baseLayerPicker: false, // 是否显示图层选择控件
      imageryProvider: false, // 不加载cesium提供的图层
      geocoder: false, // 是否显示地名查找控件
      timeline: false, // 是否显示时间线控件
      sceneModePicker: true, // 是否显示投影方式控件
      navigationHelpButton: false, // 是否显示帮助信息控件
      infoBox: false, // 是否显示点击要素之后显示的信息
    });
    viewer.scene.primitives.destroyPrimitives = false;
    viewer.scene.globe.depthTestAgainstTerrain = false;

    // 设置位置
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(109.947146, 40.619721, 30000000.0),
      orientation: {
        heading: Cesium.Math.toRadians(0.0),
        pitch: Cesium.Math.toRadians(-90.0),
        roll: 0
      }
    });

    const imgList = ['skin-blue', 'skin-black'];
    imgList.forEach(item => {
      let skinInfo = addGlobeSkin(item);
      skinInfo.skinPrimitives.show = skinInfo.id == 'skin-blue' ? true : false;
      skinList.push(skinInfo);
    });
  }

  // 加载球皮
  function addGlobeSkin(imgName) {
    const skinPrimitives = new Cesium.Primitive({
      geometryInstances: new Cesium.GeometryInstance({
        geometry: new Cesium.RectangleGeometry({
          rectangle: Cesium.Rectangle.fromDegrees(-180.0, -90.0, 180.0, 90.0),
          vertexFormat: Cesium.EllipsoidSurfaceAppearance.VERTEX_FORMAT,
        }),
      }),
      appearance: new Cesium.EllipsoidSurfaceAppearance({
        material: Cesium.Material.fromType('Image', {
          image: `../../img/${imgName}.png`
        })
      }),
    });
    viewer.scene.primitives.add(skinPrimitives);
    return { id: imgName, skinPrimitives };
  };

  // 切换球皮
  function toggleSkin(id) {
    skinList.forEach(item => {
      item.skinPrimitives.show = item.id == id ? true : false;
    });
  }

  function startup(Cesium) {
    'use strict';
    createMap();
  }

  if (typeof Cesium != 'undefined') {
    startup();
  }
</script>

</html>
