<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设置球背景色</title>
  <link rel="stylesheet" href="../../css/bootstrap.min.css" />
  <link rel="stylesheet" href="../../css/style.css" />
  <script src="../../libs/Cesium/Cesium.js"></script>
  <script src="../../libs/jquery-3.1.1.min.js"></script>
</head>

<body>
  <div id="cesiumContainer" class="fullSize"></div>

  <div class="tab-list">
    <div class="tab-content">
      <div class="tab-item" onclick="toggleBackColor('DODGERBLUE')"><span>背景1</span></div>
      <div class="tab-item" onclick="toggleBackColor('DIMGRAY')"><span>背景2</span></div>
    </div>
  </div>
</body>

<script src="../js/tabToggle.js"></script>
<script>
  var viewer;

  function createMap() {
    viewer = new Cesium.Viewer('cesiumContainer', {
      selectionIndicator: false, // 是否获取选择周指示器
      useBrowserRecommendedResolution: false, // 是否以浏览器建议的分辨率渲染
      animation: false, // 是否显示动画控件
      baseLayerPicker: false, // 是否显示图层选择控件
      imageryProvider: false, // 不加载cesium提供的图层
      geocoder: false, // 是否显示地名查找控件
      timeline: false, // 是否显示时间线控件
      sceneModePicker: true, // 是否显示投影方式控件
      navigationHelpButton: false, // 是否显示帮助信息控件
      infoBox: false, // 是否显示点击要素之后显示的信息
    });
    viewer.scene.primitives.destroyPrimitives = false;
    viewer.scene.globe.depthTestAgainstTerrain = false;

    // 设置位置
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(109.947146, 40.619721, 30000000.0),
      orientation: {
        heading: Cesium.Math.toRadians(0.0),
        pitch: Cesium.Math.toRadians(-90.0),
        roll: 0
      }
    });

  }

  // 设置球背景色
  function toggleBackColor(color) {
    viewer.scene.backgroundColor = Cesium.Color[color];
    viewer.scene.globe.baseColor = Cesium.Color[color];
  }

  function startup() {
    'use strict';
    createMap();
    toggleBackColor('DODGERBLUE');
  }

  if (typeof Cesium != 'undefined') {
    startup();
  }
</script>

</html>
