<!DOCTYPE html>
<html style="overflow: hidden">
  <head>
    <title>后端底图渲染</title>
    <meta name="keywords" content="矢量瓦片,矢量索引" />
    <meta name="description" content="后端底图渲染" />
    <meta name="content-type" content="text/html; charset=UTF-8" />
    <link href="../../../css/viewer.css" rel="stylesheet" type="text/css" />
    <link href="../../../lib/codemirror-4.5/lib/codemirror.css" type="text/css" rel="stylesheet" />
    <link rel="stylesheet" href="../../css/codeTemplate.css" />
    <script type="text/javascript" src="../../../lib/jquery/jquery-1.11.1.js"></script>
    <script src="../../../vendor/monitorSplitWindows.js"></script>
    <script type="text/javascript" src="../../js/codeTemplate.js"></script>
    <!-- 代码高亮编辑显示，需加入对应的mode模块 -->
    <script type="text/javascript" src="../../../lib/codemirror-4.5/lib/codemirror.js"></script>
    <script type="text/javascript" src="../../../lib/codemirror-4.5/mode/xml/xml.js"></script>
    <script type="text/javascript" src="../../../lib/codemirror-4.5/mode/css/css.js"></script>
    <script type="text/javascript" src="../../../lib/codemirror-4.5/mode/javascript/javascript.js"></script>
    <script type="text/javascript" src="../../../lib/codemirror-4.5/mode/htmlmixed/htmlmixed.js"></script>
    <!-- 复制功能 -->
    <script type="text/javascript" src="../../../lib/clipboard.min.js"></script>
    <script type="text/javascript">
      $(document).ready(function () {
        $('body').addClass('hj-wrap');
        $('aside').addClass('hj-transverse-split-div');
        $('aside').width('40%');
        $('section').addClass('hj-transverse-split-div');
        $('section').width('100%');
        initSplit(updateCodeDiv);

        $(window).resize(function () {
          var w = $('#asideId').width();
          // $('#sectionId').width(document.body.clientWidth - w - 20);
          updateCodeDiv();
        });

        var url = document.location.toString();
        var param = url.split('?')[1];
        var title = param.split('.')[0];
        Example.init(param);
        $('#map-iframe').attr('src', param);
        $('#map-iframe')[0].focus();
        $('.header-mid span')[0].innerText = decodeURI(title);
      });

      function updateCodeDiv() {
        var url = document.location.toString();
        var param = url.split('?')[1];
        Example.renderData(param);
      }
    </script>
  </head>

  <body>
    <div class="world-page">
      <div class="page-header">
        <div class="header-left">
          <div class="left-item revealing_code" onclick="clickSourceCode()">
            <img src="../../img/3d/codePage/ic_daima.png" alt="" />
            <span>查看源代码</span>
          </div>

          <div class="left-item">
            <img src="../../img/3d/codePage/ic_api.png" alt="" />
            <span>API</span>
          </div>
        </div>

        <div class="header-mid">
          <span>示例</span>
        </div>
      </div>

      <div class="page-content">
        <section id="sectionId" class="section-unfold">
          <div class="mapCon" id="exampleCon" style="width: 100%">
            <!--<div class="code_close" id="codeDivCloseBtn" onclick="Example.codeDivCloseBtnClick(this)"></div>-->
            <iframe id="map-iframe"></iframe>
          </div>
        </section>
      </div>

      <aside id="asideId" class="code_pack_up">
        <div class="code_area code_pack_up" id="codeAreaDiv" style="width: 100%">
          <div class="code_area_title">
            <div class="fl">源代码</div>
            <div class="fr code_title_but">
              <a id="copy-button" href="#">复制代码</a>
              <a id="run-button" href="#" class="run">运行</a>
            </div>
          </div>

          <div class="code_area_con">
            <textarea id="myresource" style="display: none"> </textarea>
          </div>
        </div>
      </aside>
    </div>
  </body>
</html>

<script type="text/javascript">
  let isShow = false;
  function clickSourceCode() {
    if (!isShow) {
      $('#asideId').removeClass('code_pack_up');
      $('.code_area').removeClass('code_pack_up');
      $('.revealing_code span')[0].innerText = '收起源代码';
      $('.revealing_code img').css({ transform: 'rotate(90deg)' });

      $('.code_area_title').mousedown(function (e) {
        var x = e.pageX;
        var y = e.pageY;
        var divx = $(this).offset().left;
        var divy = $(this).offset().top;
        $('.code_area_title').bind('mousemove', function (event) {
          var x2 = event.pageX;
          var y2 = event.pageY;
          $('#asideId').css({
            top: divy + (y2 - y) + 'px',
            left: divx + (x2 - x) + 'px',
          });
        });
      });

      $('.code_area_title').mouseup(function () {
        $('.code_area_title').unbind('mousemove');
      });
      isShow = true;
    } else {
      $('#asideId').addClass('code_pack_up');
      $('.code_area').addClass('code_pack_up');
      $('.revealing_code span')[0].innerText = '查看源代码';
      $('.revealing_code img').css({ transform: 'rotate(0deg)' });
      isShow = false;
    }
  }
</script>
