<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>矩形光源</title>
    <link rel="stylesheet" href="../../css/bootstrap.min.css" />
    <link rel="stylesheet" href="../../css/style.css" />
    <script src="../../libs/Cesium/Cesium.js"></script>
    <script src="../js/config.js"></script>
  </head>

  <body>
    <div id="cesiumContainer" class="fullSize"></div>

    <div class="tab-list tab-list-style">
      <div class="control-body">
        <div class="control-item">
          <span>宽度</span>
          <input type="range" class="form-range" id="customRange" min="0" max="1000" step="0.001" data-bind="value: width, valueUpdate: 'input'" />
          <input class="num-text" type="number" oninput="if(value<0)value=0;if(value>1000)value=1000" data-bind="value: width, valueUpdate: 'input'" />
        </div>

        <div class="control-item">
          <span>高度</span>
          <input type="range" class="form-range" id="customRange" min="0" max="1000" step="0.001" data-bind="value: height, valueUpdate: 'input'" />
          <input class="num-text" type="number" oninput="if(value<0)value=0;if(value>1000)value=1000" data-bind="value: height, valueUpdate: 'input'" />
        </div>

        <div class="control-item">
          <span>heading</span>
          <input type="range" class="form-range" id="customRange" min="-180" max="180" step="0.01" data-bind="value: heading, valueUpdate: 'input'" />
          <input class="num-text" type="number" oninput="if(value<-180)value=-180;if(value>180)value=180" data-bind="value: heading, valueUpdate: 'input'" />
        </div>

        <div class="control-item">
          <span>pitch</span>
          <input type="range" class="form-range" id="customRange" min="-180" max="180" step="0.01" data-bind="value: pitch, valueUpdate: 'input'" />
          <input class="num-text" type="number" oninput="if(value<-180)value=-180;if(value>180)value=180" data-bind="value: pitch, valueUpdate: 'input'" />
        </div>

        <div class="control-item">
          <span>roll</span>
          <input type="range" class="form-range" id="customRange" min="-180" max="180" step="0.01" data-bind="value: roll, valueUpdate: 'input'" />
          <input class="num-text" type="number" oninput="if(value<-180)value=-180;if(value>180)value=180" data-bind="value: roll, valueUpdate: 'input'" />
        </div>

        <div class="control-item">
          <span>强度</span>
          <input type="range" class="form-range" id="customRange" min="0" max="500" step="0.001" data-bind="value: intensity, valueUpdate: 'input'" />
          <input class="num-text" type="number" oninput="if(value<0)value=0;if(value>500)value=500" data-bind="value: intensity, valueUpdate: 'input'" />
        </div>

        <div class="control-item">
          <span>光源颜色</span>
          <input type="color" data-bind="value: color, valueUpdate: 'input'" />
          <span class="num-text2" data-bind="text:color"></span>
        </div>
      </div>
    </div>
  </body>

  <script>
    var viewer;
    var deferredLight;
    var viewModel = {
      width: 20,
      height: 200,
      heading: 90,
      pitch: 0,
      roll: 0,
      intensity: 20,
      color: '#ffffff',
    };

    function createMap() {
      viewer = new Cesium.Viewer('cesiumContainer', {
        animation: false, // 是否显示动画控件
        baseLayerPicker: false, // 是否显示图层选择控件
        fullscreenButton: false, // 是否显示全屏按钮控件
        vrButton: false, // 是否显示vr按钮控件
        geocoder: false, // 是否显示地名查找控件
        homeButton: false, // 是否显示主页按钮控件
        infoBox: false, // 是否显示点击要素之后显示的信息
        sceneModePicker: false, // 是否显示投影方式控件
        selectionIndicator: false, // 是否获取选择周指示器
        timeline: false, // 是否显示时间线控件
        navigationHelpButton: false, // 是否显示帮助信息控件
        useBrowserRecommendedResolution: false, // 是否以浏览器建议的分辨率渲染
        // contextOptions:{
        //   requestWebgl2:true
        // },
        // msaaSamples:4,
        imageryProvider: false, //不加载cesium提供的图层
      });
      viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString('#99ccff');
      viewer.scene.globe.enableLighting = false;
      // 启用gbuffer绘制
      viewer.scene._czmGbufferManager = new Cesium.GbufferManager(viewer.scene);
      viewer.scene._czmGBufferEnable = true;
      viewer.scene._czmRenderGBufferPass = [Cesium.Pass.CESIUM_3D_TILE];
      viewer.scene._czmGbufferManager.isReady = true;

      deferredLight = new Cesium.DeferredLight(viewer);
      // 物理光源 pbr高光效果
      viewer.scene.primitives.add(deferredLight);

      // 添加模型
      const tile3d = new Cesium.Cesium3DTileset({
        maximumMemoryUsage: modelConfig.maximumMemoryUsage, // 一个3dtiles图层占用的最大内存，默认为512M。此值如果大于客户机可使用内存，可能导致应用崩溃。
        maxmumScreenSpaceError: modelConfig.maxmumScreenSpaceError, // 默认值为16，值越小，模型越清晰，没有显卡的客户机，可以将此值设置大些，以牺牲显示效果，换取流畅的速度
        useIndexDB: modelConfig.useIndexDB, // 默认为false。是否使用indexdb存储已经下载的3dtiles瓦片，开启则会消耗更多的cpu资源，但是后续加载3dtiles的速度会变快。
        skipLevelOfDetail: modelConfig.skipLevelOfDetail, // 默认值为false，是否跳过中间层级，设置为true，可减少瓦片加载的数量。
        skipLevels: modelConfig.skipLevels, // 当开启skipLevelOfDetail时，有效，默认跳过1级。
        workNum: modelConfig.workNum, // 开启子线程的数量，默认值为0，为0时，使用主线程加载3dtiles。 cpu配置低时建议设置为0.
        // subdomains: ["1.119.169.68:10050"], // 多通道下载，高配的电脑建议设置8条通道，会加载下载速度。 低配建议2条通道，多条通道会导致同时解码的瓦片偏多，降低帧率
        url: modelConfig.cyy3dtilesUrl.tilesetUrl,
      });
      tile3d.readyPromise.then(tileset => {
        var boundingSphere = tileset.boundingSphere;
        var cartographic = Cesium.Cartographic.fromCartesian(boundingSphere.center);
        var surface = Cesium.Cartesian3.fromRadians(cartographic.longitude, cartographic.latitude, 0.0);
        var offset = Cesium.Cartesian3.fromRadians(cartographic.longitude, cartographic.latitude, -80);
        var translation = Cesium.Cartesian3.subtract(offset, surface, new Cesium.Cartesian3());
        tileset.modelMatrix = Cesium.Matrix4.fromTranslation(translation);
        viewer.scene.primitives.add(tileset);
      });

      // 设置位置
      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(114.31607057697792, 35.719363487137045, 74.13948028226281),
        orientation: {
          heading: Cesium.Math.toRadians(282.2671576525609),
          pitch: Cesium.Math.toRadians(-25.69612677270594),
          roll: Cesium.Math.toRadians(0),
        },
      });

      addRectLight();
    }

    function addRectLight() {
      const { width, height, heading, pitch, roll, intensity, color } = viewModel;
      const lonlatalt = [114.31389706242547, 35.71960276032476, 10];
      let rect = deferredLight.addRectLight({
        modelMatrix: computeHprMatrix(lonlatalt, [heading, pitch, roll], [1, 1, 1]),
        width,
        height,
        intensity,
        color: Cesium.Color.fromCssColorString(color),
      });
      rect.lonlatalt = lonlatalt;

      addControl();
    }

    function addControl() {
      Cesium.knockout.track(viewModel);
      const toolbar = document.querySelector('.tab-list');
      Cesium.knockout.applyBindings(viewModel, toolbar);
      for (const name in viewModel) {
        if (viewModel.hasOwnProperty(name)) {
          Cesium.knockout.getObservable(viewModel, name).subscribe(updatePostProcess);
        }
      }

      function updatePostProcess() {
        const { width, height, heading, pitch, roll, intensity, color } = viewModel;
        deferredLight.isUpdate = true;
        deferredLight._rectLights.forEach((pointLight, i) => {
          pointLight.width = Number(width);
          pointLight.height = Number(height);
          pointLight.modelMatrix = computeHprMatrix(pointLight.lonlatalt, [heading, pitch, roll], [1, 1, 1]);
          pointLight.intensity = Number(intensity);
          pointLight.color = Cesium.Color.fromCssColorString(color);
        });
      }
    }

    function computeHprMatrix(position = [0, 0, 0], rotation = [0, 0, 0]) {
      var position = Cesium.Cartesian3.fromDegrees(...position);
      var heading = Cesium.Math.toRadians(rotation[0]);
      var pitch = Cesium.Math.toRadians(rotation[1]);
      var roll = Cesium.Math.toRadians(rotation[2]);
      var headingPitchRoll = new Cesium.HeadingPitchRoll(heading, pitch, roll);

      var m = Cesium.Transforms.headingPitchRollToFixedFrame(position, headingPitchRoll, Cesium.Ellipsoid.WGS84, Cesium.Transforms.eastNorthUpToFixedFrame, new Cesium.Matrix4());
      return m;
    }

    function startup() {
      'use strict';
      createMap();
    }
    if (typeof Cesium !== 'undefined') {
      startup();
    }
  </script>
</html>
