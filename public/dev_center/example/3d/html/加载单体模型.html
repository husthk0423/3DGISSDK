<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>加载单体模型</title>
  <link rel="stylesheet" href="../../libs/CustomCesiumSDK/CustomCesiumSDK.css">
  <link rel="stylesheet" href="../../css/style.css" />
  <script src="../../libs/Cesium/Cesium.js"></script>
  <script src="../js/config.js"></script>
</head>

<body>
  <div id="cesiumContainer" class="fullSize"></div>
</body>

<script>
  var viewer;

  function createMap() {
    viewer = new Cesium.Viewer('cesiumContainer', {
      animation: false, // 是否显示动画控件
      baseLayerPicker: false, // 是否显示图层选择控件
      fullscreenButton: false, // 是否显示全屏按钮控件
      vrButton: false, // 是否显示vr按钮控件
      geocoder: false, // 是否显示地名查找控件
      homeButton: false, // 是否显示主页按钮控件
      infoBox: false, // 是否显示点击要素之后显示的信息
      sceneModePicker: false, // 是否显示投影方式控件
      selectionIndicator: false, // 是否获取选择周指示器
      timeline: true, // 是否显示时间线控件
      navigationHelpButton: false, // 是否显示帮助信息控件
      useBrowserRecommendedResolution: false, // 是否以浏览器建议的分辨率渲染
      // contextOptions:{
      //   requestWebgl2:true
      // },
      // msaaSamples:4,
      imageryProvider: false, //不加载cesium提供的图层
    });
    viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString("#99ccff");

    // 设置位置
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(114.29679272775388, 35.720139665800176, 103.29002247195092),
      orientation: {
        heading: Cesium.Math.toRadians(330.6169225531426),
        pitch: Cesium.Math.toRadians(-15.86506447523388),
        roll: 0
      }
    });

    // 加载 glb
    var modelMatrix = Cesium.Transforms.eastNorthUpToFixedFrame(Cesium.Cartesian3.fromDegrees(114.29585215160193, 35.72249770542608, 0));
    var model1 = new Cesium.Model.fromGltf({
      url: '../data/gltf/城市2.glb',
      scale: 100,
      modelMatrix: modelMatrix
    });
    viewer.scene.primitives.add(model1);

    // var modelMatrix = Cesium.Transforms.eastNorthUpToFixedFrame(Cesium.Cartesian3.fromDegrees(114.29585215160193, 35.72249770542608, 0));
    // var model1 = new Cesium.Model.fromGltf({
    //   url: '../data/gltf/沙扎比.glb',
    //   scale: 100,
    //   modelMatrix: modelMatrix
    // });
    // viewer.scene.primitives.add(model1);

    // 加载 gltf
    var hpRoll = new Cesium.HeadingPitchRoll(Cesium.Math.toRadians(90), Cesium.Math.toRadians(0), Cesium.Math.toRadians(0));
    var converter = Cesium.Transforms.eastNorthUpToFixedFrame;
    var modelMatrix2 = Cesium.Transforms.headingPitchRollToFixedFrame(Cesium.Cartesian3.fromDegrees(114.29568593005756, 35.72131242265601, 39.0), hpRoll, Cesium.Ellipsoid.WGS84, converter);
    var model2 = new Cesium.Model.fromGltf({
      url: '../data/gltf/火车/scene.gltf',
      scale: 0.03,
      modelMatrix: modelMatrix2
    });
    viewer.scene.primitives.add(model2);
  }

  function startup() {
    'use strict';
    createMap();
  }

  if (typeof Cesium !== 'undefined') {
    startup();
  }
</script>

</html>
