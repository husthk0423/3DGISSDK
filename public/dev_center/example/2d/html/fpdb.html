<!DOCTYPE html>
<html style="overflow : hidden; ">

<head>
  <title>分屏对比</title>
  <meta name="content-type" content="text/html; charset=UTF-8">
  <meta name="viewport"
    content="width=device-width,target-densitydpi=high-dpi,initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="../../css/leaflet.css" />
  <link rel="stylesheet" href="../../css/rarefont.css" />
  <style>
    body,
    html {
      height: 100%;
    }

    #map1 {
      width: 50%;
      height: 100%;
      float: right;
    }

    #map2 {
      float: left;
      width: 50%;
      height: 100%;
    }
  </style>
</head>

<body onload="init()" style="margin : 0; ">
  <div id="map1"></div>
  <div id="map2"></div>

  <script src="../../js/leaflet/leaflet.js"></script>
  <script src="/lib/jquery/jquery-1.11.1.js"></script>
  <script src="../../js/leaflet/CustomWebSDK.min.js"></script>
  <script>
    function init() {
      // 1.引入底图
      // 矢量底图
      var normalMapm = L.tileLayer(
          "http://t0.tianditu.gov.cn/vec_c/wmts?tk=eec8c7ee00d8d62dd60a274aa1a1beb5&SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=vec&STYLE=default&TILEMATRIXSET=c&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=tiles", {
            maxZoom: 13,
            minZoom: 5,
            zoomOffset: 1,
          }
        ),
        // 矢量注记
        normalMapa = L.tileLayer(
          "http://t0.tianditu.gov.cn/cva_c/wmts?tk=eec8c7ee00d8d62dd60a274aa1a1beb5&SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=cva&STYLE=default&TILEMATRIXSET=c&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=tiles", {
            maxZoom: 13,
            minZoom: 5,
            zoomOffset: 1,
          }
        );
      // 影响底图
      var imgMapm = L.tileLayer(
          "http://t0.tianditu.gov.cn/img_c/wmts?tk=eec8c7ee00d8d62dd60a274aa1a1beb5&SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=img&STYLE=default&TILEMATRIXSET=c&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=tiles", {
            maxZoom: 13,
            minZoom: 5,
            zoomOffset: 1,
          }
        ),
        // 影像注记
        imgMapa = L.tileLayer(
          "http://t0.tianditu.gov.cn/cia_c/wmts?tk=eec8c7ee00d8d62dd60a274aa1a1beb5&SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=cia&STYLE=default&TILEMATRIXSET=c&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=tiles", {
            maxZoom: 13,
            minZoom: 5,
            zoomOffset: 1,
          }
        );
      // 定义图层组
      var normalMap = L.layerGroup([normalMapm, normalMapa]),
        imgMap = L.layerGroup([imgMapm, imgMapa]);
      // 定义地图容器
      //   1.定义底图
      var map1 = L.map("map1", {
        crs: L.CRS.EPSG4326, // 参考坐标系
        center: [30.49, 114.42], //地图中心点
        zoom: 15, //当前缩放级别
        layers: [normalMap], //当前显示图层
        zoomControl: false, //控制是否显示缩放按钮
      });
      var map2 = L.map("map2", {
        crs: L.CRS.EPSG4326, // 参考坐标系
        center: [30.49, 114.42], //地图中心点
        zoom: 15, //当前缩放级别
        layers: [imgMap], //当前显示图层
        zoomControl: false, //控制是否显示缩放按钮
      });

      var maps = [map1, map2];
      // 监听事件触发后依次为地图对象设置视图，将触发事件的地图视图给到其他地图对象
      function mapLink(e) {
        var _this = this; // this指向触发事件的地图对象
        maps.map(function (t) {
          t.setView(_this.getCenter(), _this.getZoom())
        })
      }
      // 地图对象绑定缩放、平移监听事件  
      maps.map(function (t) {
        t.on({
          drag: mapLink,
          zoom: mapLink
        })
      })

    }
  </script>

</body>

</html>
