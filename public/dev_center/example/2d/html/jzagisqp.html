<!DOCTYPE html>
<html style="overflow : hidden; ">

<head>
  <title>加载arcgis切片服务</title>
  <meta name="content-type" content="text/html; charset=UTF-8">
  <meta name="viewport"
    content="width=device-width,target-densitydpi=high-dpi,initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="../../css/leaflet.css" />
  <link rel="stylesheet" href="../../css/rarefont.css" />
</head>

<body onload="init()" style="margin : 0; ">
  <div id="map" class="map" style="position:absolute;bottom:0px;top:0px;width:100%">
    <span id="jwd" style="position:absolute;bottom:10px;left:5px;z-index: 1000"></span>
  </div>

  <script src="../../js/leaflet/leaflet.js"></script>
  <script src="/lib/jquery/jquery-1.11.1.js"></script>
  <script src="../../js/leaflet/CustomWebSDK.min.js"></script>

  <!-- 引入arcgis插件js  -->
  <script src="../../js/leaflet/esri-leaflet.js"></script>
  <script>
    var map = L.map('map').setView([37.7614, -122.3911], 12);
    L.esri.tiledMapLayer({
      url: 'https://services.arcgisonline.com/ArcGIS/rest/services/USA_Topo_Maps/MapServer',
      maxZoom: 15
    }).addTo(map);
  </script>

</body>

</html>
