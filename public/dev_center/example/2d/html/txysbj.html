<!DOCTYPE html>
<html style="overflow : hidden; ">

<head>
  <title>图形样式编辑</title>
  <meta name="content-type" content="text/html; charset=UTF-8">
  <meta name="viewport"
    content="width=device-width,target-densitydpi=high-dpi,initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="../../css/leaflet.css" />
  <link rel="stylesheet" href="../../css/rarefont.css" />
  <!-- 引入图形样式编辑css-->
  <link rel="stylesheet" href="../../css/Leaflet.StyleEditor.css" />
</head>

<body onload="init()" style="margin : 0; ">
  <div id="map" class="map" style="position:absolute;bottom:0px;top:0px;width:100%"></div>

  <script src="../../js/leaflet/leaflet.js"></script>
  <script src="../../js/leaflet/CustomWebSDK.min.js"></script>

  <!-- 引入图形样式编辑插件 -->
  <script src="../../js/leaflet/Leaflet.StyleEditor.min.js"></script>

  <script>
    function init() {
      var map = L.map('map', {
        crs: L.CRS.CustomEPSG4326,
        center: {
          lon: 121.4302,
          lat: 28.6024
        },
        zoom: 16,
        inertiaDeceleration: 15000,
        maxZoom: 20
      });
      //添加底图
      var layer = new L.TileLayer(
        'http://t0.tianditu.gov.cn/vec_c/wmts?tk=eec8c7ee00d8d62dd60a274aa1a1beb5&SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=vec&STYLE=default&TILEMATRIXSET=c&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=tiles', { tileSize: 256 });
      map.addLayer(layer);

      var latlngs = [map.getCenter(), [28.6020, 121.4300],
      [28.6035, 121.4315],
      [28.6070, 121.4340],
      [28.6090, 121.4340], map.getCenter()
      ]
      L.polygon(latlngs, {
        color: '#000eff',
        fillColor: 'red',
        weight: 1
      }).addTo(map);

      var marker = L.marker([28.6060, 121.4310]).addTo(map);
      //          

      // 引入图形样式编辑插件

      let forms = {
        'geometry': {
          'fillColor': true,
          'color': true,
          'weight': true,
          'dashArray': true,
          'fillOpacity': true,
          'popupContent': true,
          'opacity': true
        },
        'marker': {
          'icon': true,
          'color': true,
          'popupContent': true,
          'size': true
        }
      }
      let styleEditor = L.control.styleEditor({
        forms,
        markers: ['circle-stroked', 'circle', 'square-stroked', 'square'],
        colorRamp: ['#1abc9c', '#2ecc71', '#3498db'],
        position: 'topleft'
      });
      map.addControl(styleEditor);
    }
  </script>

</body>

</html>
