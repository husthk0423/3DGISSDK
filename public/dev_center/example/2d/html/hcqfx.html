<!DOCTYPE html>
<html style="overflow : hidden; ">

<head>
  <title>缓冲区分析</title>
  <meta name="content-type" content="text/html; charset=UTF-8">
  <meta name="viewport"
    content="width=device-width,target-densitydpi=high-dpi,initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="../../css/leaflet.css" />
  <link rel="stylesheet" href="../../css/rarefont.css" />
</head>

<body style="margin : 0; ">
  <div id="map" class="map" style="position:absolute;bottom:0px;top:0px;width:100%;z-index: -1">
    <span id="jwd" style="position:absolute;bottom:10px;left:5px;z-index: 1000"></span>
  </div>
  <script src="../../js/leaflet/leaflet.js"></script>
  <script src="/lib/jquery/jquery-1.11.1.js"></script>
  <script src="../../js/leaflet/CustomWebSDK.min.js"></script>

  <!-- 引入分析插件js  -->
  <script src="../../js/turf.min.js"></script>
  <script>
    var map = L.map('map', {
      crs: L.CRS.CustomEPSG4326,
      center: {
        lon: 121.4302,
        lat: 28.6024
      },
      zoom: 16,
      inertiaDeceleration: 15000,
      maxZoom: 20
    });
    //添加底图
    var layer = new L.TileLayer(
      'http://t0.tianditu.gov.cn/vec_c/wmts?tk=eec8c7ee00d8d62dd60a274aa1a1beb5&SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=vec&STYLE=default&TILEMATRIXSET=c&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=tiles', {
      tileSize: 256
    });
    map.addLayer(layer);

    // 绘制点缓冲区
    var point = turf.point([121.4280, 28.6050]);
    var buffered1 = turf.buffer(point, 0.1, {
      units: 'miles'
    });
    L.geoJSON(point).addTo(map);
    L.geoJSON(buffered1).addTo(map);

    // 绘制线缓冲区
    var line = turf.lineString([
      [121.4280, 28.6010],
      [121.4290, 28.6015],
      [121.4300, 28.6005]
    ]);
    var buffered2 = turf.buffer(line, 0.05, {
      units: 'miles'
    });
    L.geoJSON(line).addTo(map);
    L.geoJSON(buffered2).addTo(map);
    // 绘制面缓冲区
    var polygon = turf.polygon([
      [
        [121.4300, 28.6050],
        [121.4315, 28.6035],
        [121.4340, 28.6070],
        [121.4340, 28.6090],
        [121.4300, 28.6050]
      ]
    ]);
    var buffered3 = turf.buffer(polygon, 0.01, {
      units: 'miles'
    });
    L.geoJSON(polygon).addTo(map);
    L.geoJSON(buffered3).addTo(map);
  </script>

</body>

</html>
