<!DOCTYPE html>
<html style="overflow : hidden; ">

<head>
  <title>多服务注记要素</title>
  <meta name="content-type" content="text/html; charset=UTF-8">
  <meta name="viewport"
    content="width=device-width,target-densitydpi=high-dpi,initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="../../css/leaflet.css" />

</head>

<body onload="init()" style="margin : 0; ">
  <div id="map" class="map" style="position:absolute;bottom:0px;top:0px;width:100%"></div>

  <script src="../../js/leaflet/leaflet.js"></script>
  <script src="../../js/leaflet/CustomWebSDK.js"></script>
  <script>
    function init() {
      var map = L.map('map', {
        crs: L.CRS.CustomEPSG4326,
        center: {
          lon: 113.464340,
          lat: 34.165281
        },
        zoom: 16,
        inertiaDeceleration: 15000,
        maxZoom: 20
      });
      //添加注记
      var labelLayer = new L.GWVTAnno({
        tileSize: 512
      });
      var dataSource1 = new Custom.URLDataSource();
      dataSource1.url ="http://1.119.169.71:10012/mapserver/label/全国行政区划/getData?x={x}&y={y}&l={z}&styleId=默认"

      labelLayer.addDataSource(dataSource1);

      var dataSource2 = new Custom.URLDataSource();
      dataSource2.url ="http://1.119.169.71:10012/mapserver/label/测试自定义注记/getData?x={x}&y={y}&l={z}&styleId=选注记字段"

      labelLayer.addDataSource(dataSource2);
      map.addLayer(labelLayer);
    }
  </script>

</body>

</html>
