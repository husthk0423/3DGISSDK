<!DOCTYPE html>
<html style="overflow : hidden; ">

<head>
  <title>加载生僻字</title>
  <meta name="content-type" content="text/html; charset=UTF-8">
  <meta name="viewport"
    content="width=device-width,target-densitydpi=high-dpi,initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="../../css/leaflet.css" />
  <link rel="stylesheet" href="../../css/rarefont.css" />
</head>

<body onload="init()" style="margin : 0; ">
  <div id="map" class="map" style="position:absolute;bottom:0px;top:0px;width:100%"></div>

  <script src="../../js/leaflet/leaflet.js"></script>
  <script src="../../js/leaflet/CustomWebSDK.js"></script>
  <script>
    function init() {
      var map = L.map('map', {
        crs: L.CRS.CustomEPSG4326,
        center: {
          lon: 120.09215287988154,
          lat: 30.277052933991797
        },
        zoom: 12,
        inertiaDeceleration: 15000,
        maxZoom: 20
      });
      //添加底图
      var layer = new L.GXYZ(
        'http://1.119.169.71:10012/mapserver/layer/全国行政区划/getMap?x={x}&y={y}&l={z}&styleId=默认',
        {
          tileSize: 512
        });
      map.addLayer(layer);

    //添加注记
    var labelLayer = new L.GWVTAnno({
        tileSize: 512
      });
      var dataSource = new Custom.URLDataSource();
      // dataSource.url =
      //   'http://ditu.zjzwfw.gov.cn/mapserver/label/zjvmap/getDatas?x={x}&y={y}&l={z}&styleId=tdt_biaozhunyangshi_2017';
      dataSource.url ="http://1.119.169.71:10012/mapserver/label/全国行政区划/getData?x={x}&y={y}&l={z}&styleId=默认"
      labelLayer.addDataSource(dataSource);
      map.addLayer(labelLayer);
    }
  </script>

</body>

</html>
