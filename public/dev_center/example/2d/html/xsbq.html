<!DOCTYPE html>
<html style="overflow : hidden; ">

<head>
  <title>显示mark标签</title>
  <meta name="content-type" content="text/html; charset=UTF-8">
  <meta name="viewport"
    content="width=device-width,target-densitydpi=high-dpi,initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="../../css/leaflet.css" />
  <link rel="stylesheet" href="../../css/rarefont.css" />
</head>

<body onload="init()" style="margin : 0; ">
  <div id="map" class="map" style="position:absolute;bottom:0px;top:0px;width:100%">
    <span id="jwd" style="position:absolute;bottom:10px;left:5px;z-index: 1000"></span>
  </div>

  <script src="../../js/leaflet/leaflet.js"></script>
  <script src="/lib/jquery/jquery-1.11.1.js"></script>
  <script src="../../js/leaflet/CustomWebSDK.min.js"></script>
  <script>
    function init() {
      var map = L.map('map', {
        crs: L.CRS.CustomEPSG4326,
        center: {
          lon: 120.09215287988154,
          lat: 30.277052933991797
        },
        zoom: 12
      });
        //添加底图
        var layer = new L.TileLayer(
        'http://t0.tianditu.gov.cn/vec_c/wmts?tk=eec8c7ee00d8d62dd60a274aa1a1beb5&SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=vec&STYLE=default&TILEMATRIXSET=c&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=tiles', { tileSize: 256 });
      map.addLayer(layer);
      // 2.点击鼠标绘制标记（makr）
      //  sContent就是浮云框的显示字段
      var sContent = ` <div style="margin: 0px">
                <div style="margin: 10px 10px">
                    <img
                    style="float: left; margin: 0px 10px"
                    src="/img/fileUpload.png"
                    width="48"
                    height="48"
                    title="武汉"
                    />
                    <div style='margin:10px 0px 10px 120px'>
                    电话 : (010)88187700
                    <br />地址：武汉市光谷企业天地四号楼"
                    </div>
                    <input  id='keyWord' value='地铁' type='text' style='border: 1px solid #cccccc;width: 180px;height: 20px;line-height: 20px;padding-left: 10px;display: block;float: left;'/>
                    <input style='margin-left:195px;  width: 80px;height: 24px; text-align: center; background: #5596de;color: #FFF;border: none;display: block;cursor: pointer;' type='button' value='周边搜索'  onClick="localsearch.searchNearby(document.getElementById('keyWord').value,center,radius)">
                </div>
                </div>`;
      var marker = L.marker([30.484338, 114.422474]).addTo(map);
      map.on("click", function (e) {
        var lat = e.latlng.lat;
        var lng = e.latlng.lng;
        marker.setLatLng([lat, lng]);
        // 点击mark出现弹框
        marker.bindPopup(sContent);
      });
    }
  </script>

</body>

</html>
