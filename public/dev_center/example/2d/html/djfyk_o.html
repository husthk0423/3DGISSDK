<!DOCTYPE html>
<html style="overflow : hidden; ">

<head>
  <title>叠加浮云框</title>
  <meta name="content-type" content="text/html; charset=UTF-8">
  <meta name="viewport"
    content="width=device-width,target-densitydpi=high-dpi,initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="../../css/theme/default/style.css" type="text/css">
  <!--引入生僻字css-->
  <link rel="stylesheet" href="css/rarefont.css" />
</head>

<body onload="init()" style="margin : 0; ">
  <div id="map" class="map" style="position:absolute;bottom:0px;top:0px;width:100%"></div>

  <script src="../../js/openlayers/OpenLayers.debug.js"></script>
  <script src="../../js/openlayers/CustomWebSDK.min.js"></script>
  <script>
    function init() {
      var map = new OpenLayers.Map({
        div: "map",
        projection: "EPSG:4326",
        numZoomLevels: 22
      });

      //512格网的瓦片
      var size = new OpenLayers.Size(512, 512);
      var layer = new OpenLayers.Layer.GXYZ("layer",
        'http://ditu.zjzwfw.gov.cn/mapserver/vmap/zjvmap/getMAP?x=${x}&y=${y}&l=${z}&styleId=tdt_biaozhunyangshi_2017', {
          isBaseLayer: true,
          tileSize: size
        });
      map.addLayer(layer);

      //512格网的瓦片
      var labelLayer = new OpenLayers.Layer.GWVTAnno("GWVTAnno", {
        tileSize: size,
        opacity: 1
      });
      var dataSource = new Custom.URLDataSource();
      dataSource.url =
        'http://ditu.zjzwfw.gov.cn/mapserver/label/zjvmap/getDatas?x=${x}&y=${y}&l=${z}&styleId=tdt_biaozhunyangshi_2017';
      labelLayer.addDataSource(dataSource);
      map.addLayer(labelLayer);
      map.setCenter(new OpenLayers.LonLat(121.4302, 28.6024), 16);



      var markers = new OpenLayers.Layer.Markers("Markers");
      map.addLayer(markers);
      var size = new OpenLayers.Size(25, 35);
      var offset = new OpenLayers.Pixel(-(size.w / 2), -size.h);
      var icon = new OpenLayers.Icon('..../../img/marker-icon.png', size, offset);
      markers.addMarker(new OpenLayers.Marker(new OpenLayers.LonLat(121.4302, 28.6024), icon));
      // The location of our marker and popup. We usually think in geographic
      // coordinates ('EPSG:4326'), but the map is projected ('EPSG:3857').
      var myLocation = new OpenLayers.Geometry.Point(map.getCenter())
        .transform('EPSG:4326', 'EPSG:3857');

      // We add the marker with a tooltip text to the overlay


      // A popup with some information about our location
      var popup = new OpenLayers.Popup.FramedCloud("Popup",
        map.getCenter(), null,
        '我是浮云框的内容', null,
        true // <-- true if we want a close (X) button, false otherwise
      );
      // and add the popup to it.
      map.addPopup(popup);
    }
  </script>

</body>

</html>
